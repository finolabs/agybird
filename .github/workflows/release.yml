name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package and plugin versions
        run: node -e "const p=require('./package.json'); const m=[require('./.claude-plugin/plugin.json'), require('./.codex-plugin/plugin.json'), require('./.antigravity-plugin/plugin.json')]; if ('v'+p.version !== process.env.GITHUB_REF_NAME || m.some((x) => x.version !== p.version)) process.exit(1)"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Agybird $GITHUB_REF_NAME"
